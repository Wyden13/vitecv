<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Job Match: each requirement in the posting links to evidence in the resume, missing ones are marked gap, the importance-weighted score fills to 82%, and a suggestion explains how to improve"><style>text{font-family:Poppins, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif}.serif{font-family:'Source Serif 4', Georgia, 'Times New Roman', serif}.mono{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace}.fb{transform-box:fill-box}.ol{transform-origin:left center}.oc{transform-origin:center}.spin{transform-box:fill-box;transform-origin:center;animation:sp 1.2s cubic-bezier(.45,0,.25,1) infinite}@keyframes sp{0%{transform:rotate(0) scale(.7)}50%{transform:rotate(90deg) scale(1)}100%{transform:rotate(180deg) scale(.7)}}@keyframes kfade{0%,90.0%{opacity:1}95.0%{opacity:0}100%{opacity:1}}.fade{animation:kfade 10s linear infinite}@keyframes k1{0%,4.0%{stroke-dashoffset:260}9.5%,94.99%{stroke-dashoffset:0}95.0%,100%{stroke-dashoffset:260}}.k1{animation:k1 10s cubic-bezier(.3,0,.2,1) infinite;}@keyframes k2{0%,7.5%{opacity:0;transform:scale(.6)}10.5%,94.99%{opacity:1;transform:none}95.0%,100%{opacity:0;transform:scale(.6)}}.k2{animation:k2 10s cubic-bezier(.2,1.4,.4,1) infinite;transform-box:fill-box;transform-origin:center}@keyframes k3{0%,9.5%{stroke-dashoffset:260}15.0%,94.99%{stroke-dashoffset:0}95.0%,100%{stroke-dashoffset:260}}.k3{animation:k3 10s cubic-bezier(.3,0,.2,1) infinite;}@keyframes k4{0%,13.0%{opacity:0;transform:scale(.6)}16.0%,94.99%{opacity:1;transform:none}95.0%,100%{opacity:0;transform:scale(.6)}}.k4{animation:k4 10s cubic-bezier(.2,1.4,.4,1) infinite;transform-box:fill-box;transform-origin:center}@keyframes k5{0%,15.0%{stroke-dashoffset:260}20.5%,94.99%{stroke-dashoffset:0}95.0%,100%{stroke-dashoffset:260}}.k5{animation:k5 10s cubic-bezier(.3,0,.2,1) infinite;}@keyframes k6{0%,18.5%{opacity:0;transform:scale(